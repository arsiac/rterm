name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  BINARY_NAME: rterm
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: clippy + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run clippy (release gate, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compile check
        run: cargo build --workspace --all-targets

  build:
    name: ${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_os: linux
            artifact_arch: amd64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_os: linux
            artifact_arch: arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_os: macos
            artifact_arch: amd64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            artifact_os: macos
            artifact_arch: aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_os: windows
            artifact_arch: amd64
            ext: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_os: windows
            artifact_arch: arm64
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --target ${{ matrix.target }}

      - name: Run build
        run: cargo build --release --target ${{ matrix.target }}
