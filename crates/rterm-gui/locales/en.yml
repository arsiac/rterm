  remember_desc: When enabled, the derived key is stored in the system keyring so the app unlocks automatically on launch without prompting. Disable keyring support and you will be prompted every launch. The keyring is protected by your system login password.
  status_random: Using a random key (no passphrase)
  status_random_desc: Credentials are encrypted with a system-generated key stored in the system keyring, so the app unlocks automatically on this device without a passphrase. This mode cannot be synced across devices; set a master passphrase before enabling sync.
  setup: Set master passphrase
  disable: Disable master passphrase
  setup_hint: After setting a passphrase, credentials are re-encrypted with it and can be synced across devices; the re-encryption runs on this device and requires entering the new passphrase once.
  disabled: Master passphrase disabled; credentials are now encrypted with a local random key (sync unavailable)
  enable_sync_required: Set a master passphrase before enabling sync
  keyring_lost: The local keyring had no random key; a new local key was generated. Previously saved credentials may no longer decrypt — please re-enter them
