masterpw:
  set_title: Set master passphrase
  set_body: Set a master passphrase to encrypt session credentials. It derives the key; the passphrase itself is never stored. If forgotten, saved credentials cannot be recovered.
  unlock_title: Unlock credential vault
  unlock_body: Enter your master passphrase to decrypt session credentials.
