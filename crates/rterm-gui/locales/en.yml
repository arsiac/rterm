  connect_timeout: Connect timeout (seconds, 0 = no limit)
  keepalive: SSH keepalive interval (seconds, 0 = disabled)
  keepalive_hint: Sends keepalive packets when the connection is idle, preventing NAT devices and firewalls from silently dropping it. Applies only to newly opened connections.
  keepalive_max: Keepalive failures before disconnecting (0 = never)
  keepalive_max_hint: Declares the connection dead after this many unanswered keepalive packets, so it takes roughly (value + 1) intervals to notice a drop. 0 still sends keepalives but never disconnects on them. Applies only when the keepalive interval is above 0, and only to newly opened connections.
  max_concurrent: Maximum concurrent transfers
  max_concurrent_hint: Takes effect immediately — raising it starts more queued transfers at once, while lowering it never interrupts transfers in progress and converges once they finish.
  retry_attempts: Automatic retries on failure
  retry_attempts_hint: Only transient failures (network blips, timeouts, dropped channels) are retried automatically, with exponential backoff (1.5s up to 8s); 0 disables automatic retries. Cancellations and permission errors are never retried.
  sub_files: Files
  editor_label: External editor
  editor_placeholder: Leave empty for the system default program
  editor_help: Command used to open remote files for local editing (right-click a file in the file manager). It is split on whitespace into program and arguments, and the local copy path is appended as the last argument. Quoted paths inside arguments are not supported; leave empty to use the system default program.
  edit_cache_days_label: Edit cache retention (days)
  edit_cache_days_help: Local edit copies are grouped by day and stale ones are removed on startup; 0 keeps them until you delete them manually.
  scrollback: Scrollback lines (0 = none)
  scrollback_note: Applies only to newly opened terminal tabs.
  log_level: Log level
  open_log_folder: Open log folder
  restart_note: Takes effect after restart; third-party library logs are suppressed to reduce noise.
  about_name: Name
  about_version: Version
  about_desc: Description
  about_description: An SSH GUI client built with Rust + iced, with session management and SFTP file transfer.
  ui_font_placeholder: Select or type a font family
  ui_font_default: Use system default
  theme: Theme
  ui_font: UI font (searchable; leave empty for system default)
  ui_font_preview: UI font preview
  terminal_theme: Terminal color theme
  terminal_font: Terminal font (monospace only)
  terminal_font_placeholder: Select or type a monospace font family
  terminal_font_preview: Terminal font preview
  terminal_font_size: Terminal font size
  appearance_note: Terminal color theme, font, and size all apply to all open tabs immediately.
  language: Language
  language_system: Follow system
  language_zh_cn: Simplified Chinese
  language_en: English
  cwd_bootstrap: Auto-track terminal directory
  cwd_bootstrap_hint: When enabled, a script is automatically executed in the terminal to report the current working directory for the SFTP Enter terminal directory button.
  suppress_bootstrap_echo: Suppress terminal echo during script and job injection
  suppress_bootstrap_echo_hint: When enabled, the PTY is configured with ECHO=0 while the directory bootstrap script and the startup command are injected, to prevent the injected text from appearing on screen. When disabled, they will be echoed normally.
  run_startup_command: Run startup command on connect
  run_startup_command_hint: When enabled, the startup command configured for the session is sent to the remote shell once the connection is ready.
  restore_cwd_on_reconnect: Restore working directory on reconnect
  restore_cwd_on_reconnect_hint: When enabled, the directory captured before the disconnect is sent to the new shell as a cd command, so the terminal returns to where it was. A directory that no longer exists is reported by the shell itself.
  trim_trailing_whitespace: Trim trailing whitespace on copy
  trim_trailing_whitespace_hint: When enabled, trailing spaces and tabs are removed from each line when copying selected terminal text.
  copy_on_select: Auto-copy on selection
  copy_on_select_hint: What happens to the selected text when you release a drag selection. "Selection (PRIMARY)" keeps it available for middle-click paste; "Clipboard" copies it for Ctrl+V and shows a notification; "Off" only copies via explicit actions (right-click menu / keyboard).
  copy_on_select_primary: Selection buffer
  copy_on_select_clipboard: Clipboard
  copy_on_select_off: Off
  copy_on_select_linux_only: The selection buffer is only available on Linux (PRIMARY maps to the system clipboard elsewhere).
  bell: Visual bell (flash the tab)
  bell_hint: When enabled, the tab briefly flashes when the terminal receives a bell character (BEL), so programs can alert you without a sound.
  scrollbar: Show terminal scrollbar
  scrollbar_hint: Overlays a translucent scrollbar on the right edge of the terminal; drag it or click the empty track to look back through history.
  paste_warn_enabled: Confirm before pasting a large amount of text
  paste_warn_enabled_hint: Asks for confirmation when a paste reaches the line or byte threshold, so a stray bulk paste cannot run a batch of commands by accident. Applies to all open tabs immediately.
  paste_warn_control_chars: Also confirm pastes containing control characters
  paste_warn_control_chars_hint: Warns whenever a paste contains control characters other than Tab, Enter, and newline — even below the size thresholds — since these can drive the shell or change terminal state.
  remember_window_size: Remember window size
  remember_window_size_hint: Restores the last non-maximized window size on startup. Closing a maximized window keeps the previous non-maximized size. Turning this off clears the saved size.
  sub_known_hosts: Known hosts
  known_hosts_desc: Hosts you approved on first connection are recorded here. Forgetting one makes the next connection ask for confirmation again.
  known_hosts_empty: No trusted hosts yet.
  known_hosts_forget: Forget
