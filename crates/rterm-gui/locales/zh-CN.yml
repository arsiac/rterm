  status_random_desc: 凭据由系统随机生成的主密钥加密，密钥保存在系统钥匙串中，本机启动自动解锁、无需输入口令；此模式不可用于跨设备同步，开启同步前需先设置主密码。
  setup: 设置主密码
  disable: 关闭主密码
  disable_confirm_title: 关闭主密码？
  disable_confirm_body: 关闭后将立即生成本机随机密钥，并用它重新加密全部会话凭据；由当前主密码派生的密钥会被当场丢弃。
  disable_confirm_note: 此操作不可撤销。关闭后本机将自动解锁、无需输入口令，且不再支持跨设备同步，除非重新设置主密码。
  setup_hint: 设置主密码后，凭据改由主密码加密，可在多设备间同步共享；设置时本机会用新口令重新加密全部凭据，期间需输入一次主密码。
