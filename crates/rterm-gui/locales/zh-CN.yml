  bell_hint: 开启后终端收到响铃字符（BEL，即 \a）时对应标签短暂闪烁，作为程序提示音的可视替代。
  scrollbar: 显示终端滚动条
  scrollbar_hint: 在终端内容右侧叠加一条半透明滚动条，可拖动或点击空轨回看历史输出。
  paste_warn_enabled: 粘贴大量文本前确认
  paste_warn_enabled_hint: 当粘贴达到行数或字节阈值时弹窗确认，避免误贴一批命令直接执行。对所有已打开的标签立即生效。
