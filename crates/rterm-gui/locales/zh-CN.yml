  keepalive: SSH 保活间隔（秒，0 表示关闭）
  keepalive_hint: 连接空闲时周期性发送保活包，避免被 NAT / 防火墙静默断开；仅对新建连接生效。
  keepalive_max: 保活无应答判死次数（0 表示不判死）
  keepalive_max_hint: 连续这么多次保活包无人应答就判定连接已断开，实际约需（该值 + 1）× 保活间隔才能发现断线。0 表示照常发送保活包但永不据此判死；调大更容忍链路抖动，调小更快发现断线。仅在保活间隔大于 0 时有意义，且只对新建连接生效。
  max_concurrent: 最大并发传输数
  max_concurrent_hint: 即时生效：调大后立刻启动更多排队任务；调小不会打断进行中的传输，待其完成后收敛。
  retry_attempts: 失败自动重试次数
  retry_attempts_hint: 仅对瞬时故障（网络抖动、超时、通道断开）自动重试，退避间隔逐次翻倍（1.5s 起、最长 8s）；0 表示关闭自动重试，取消与权限类错误从不自动重试。
  sub_files: 文件
  editor_label: 外部编辑器
  editor_placeholder: 留空则使用系统默认程序
  editor_help: 在文件管理器中右键「本地编辑」时用来打开远程文件的命令。按空白符拆成程序与参数，本地副本路径追加为末参；参数中的引号路径不受支持。留空则使用系统默认程序打开。
  edit_cache_days_label: 编辑缓存保留天数
  edit_cache_days_help: 本地编辑副本按发起日期分组，启动时清理超过保留期的旧目录；0 为不自动清理，留待手工删除。
