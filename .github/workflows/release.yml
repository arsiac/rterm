name: Release

on:
  push:
    tags:
      - "v*"

env:
  BINARY_NAME: rterm

jobs:
  build:
    name: Build ${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_os: linux
            artifact_arch: amd64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_os: linux
            artifact_arch: arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_os: darwin
            artifact_arch: amd64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            artifact_os: darwin
            artifact_arch: aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_os: windows
            artifact_arch: amd64
            ext: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_os: windows
            artifact_arch: arm64
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            pkg-config

      # Pin the Linux binaries to glibc 2.28 (RHEL 8 / Debian 10 / Ubuntu 20.04).
      # cargo-zigbuild pairs a Rust linker wrapper with zig as the C compiler,
      # linking against old glibc stubs, so C dependencies (aws-lc-sys) no
      # longer pull in newer symbols. ziglang is zig's official PyPI package.
      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        run: |
          # GitHub runners ship a pinned uv; install it if absent.
          command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
          uv tool install cargo-zigbuild
          # `uv tool` venvs are isolated, so expose the bundled zig on PATH.
          ZIGBIN="$(find ~/.local/share/uv/tools -path '*site-packages/ziglang/zig' | head -1)"
          ln -sf "$ZIGBIN" "$HOME/.local/bin/zig"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build (Linux, glibc 2.28)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.28

      - name: Build (macOS/Windows)
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          BINARY="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          MAX_GLIBC=$(objdump -T "$BINARY" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "max required glibc: $MAX_GLIBC"
          # Pass when MAX_GLIBC sorts before-or-equal to GLIBC_2.28 in version order.
          if [ "$(printf '%s\nGLIBC_2.28\n' "$MAX_GLIBC" | sort -Vu | tail -1)" != "GLIBC_2.28" ]; then
            echo "::error::glibc requirement ($MAX_GLIBC) exceeds pinned floor 2.28"
            exit 1
          fi

      - name: Package artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BINARY="${{ env.BINARY_NAME }}${{ matrix.ext }}"
          if [ "${{ runner.os }}" != "Windows" ]; then
            strip "target/${{ matrix.target }}/release/$BINARY"
          fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BINARY" dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.zip" "$BINARY"
          else
            zip -r "../${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.zip" "$BINARY"
          fi
        working-directory: ${{ github.workspace }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y
          $dest = Join-Path "${env:ProgramFiles(x86)}" "Inno Setup 6\Languages"
          if (-not (Test-Path $dest)) { New-Item -Path $dest -ItemType Directory -Force | Out-Null }
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/gh/jrsoftware/issrc@main/Files/Languages/ChineseSimplified.isl" `
            -OutFile (Join-Path $dest "ChineseSimplified.isl")
          echo "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $binPath = "${{ github.workspace }}\target\${{ matrix.target }}\release\rterm.exe"
          if (-not (Test-Path $binPath)) { throw "Built binary not found: $binPath" }
          iscc /DMyAppVersion=$ver /DBinPath=$binPath /DOs=windows /DArch=${{ matrix.artifact_arch }} packaging/windows/rterm.iss

      - name: Build deb/rpm packages (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cargo install cargo-deb cargo-generate-rpm --locked
          # Reuse the zigbuild-produced binary; a plain `cargo deb` build would
          # recompile with the system toolchain and raise the glibc floor again.
          cargo deb --target ${{ matrix.target }} --no-build
          cargo generate-rpm --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb \
            "${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.deb"
          cp target/${{ matrix.target }}/generate-rpm/*.rpm \
            "${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.rpm"

      - name: Generate SHA-256 checksums
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          files=(rterm-*.zip rterm-*.deb rterm-*.rpm)
          for f in "${files[@]}"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
            cat "$f.sha256"
          done

      - name: Generate SHA-256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -File rterm-*.zip, rterm-*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            # Write ASCII with LF line endings so `sha256sum -c` accepts it on Linux/macOS.
            [IO.File]::WriteAllText("$($_.FullName).sha256", "$hash  $($_.Name)`n")
            Get-Content "$($_.FullName).sha256"
          }

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.BINARY_NAME }}-*.zip
            ${{ env.BINARY_NAME }}-*.exe
            ${{ env.BINARY_NAME }}-*.deb
            ${{ env.BINARY_NAME }}-*.rpm
            ${{ env.BINARY_NAME }}-*.sha256
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
