  toggle_locked: The credential vault is locked, so this export can only carry connection settings.
  import_title: Import sessions with credentials
  import_body: This export is protected by its export passphrase. After you enter it, credentials are unwrapped and re-encrypted with this machine's key, so the passphrase is never needed again.
